<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cosmic Slate / Obsidian Abyss Background -->
    <radialGradient id="bg8" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#0f253e" />
      <stop offset="50%" stop-color="#081424" />
      <stop offset="100%" stop-color="#02060e" />
    </radialGradient>

    <!-- Outer Squircle Ring Gradient (Electric Cyan to Indigo) -->
    <linearGradient id="ring8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Divine Spiritual Radiance Glow -->
    <radialGradient id="aura8" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Celestial Cyan Trishul Gradient -->
    <linearGradient id="bladeGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#7dd3fc" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Luminous Silver-Cyan Crescent Moon Gradient -->
    <linearGradient id="moonGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Third Eye Sacred Fiery Gradient -->
    <linearGradient id="eyeGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Gold Accent for Damru & Bindu -->
    <linearGradient id="goldGrad8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bg8)" />
  <rect width="498" height="498" x="7" y="7" rx="113" fill="none" stroke="url(#ring8)" stroke-width="6" />

  <!-- Ambient Radiant Spiritual Aura -->
  <circle cx="256" cy="210" r="190" fill="url(#aura8)" />

  <!-- Shiva's Luminous Crescent Moon (Chandrama) -->
  <path d="M 115 175
           C 155 295 256 325 256 325
           C 256 325 357 295 397 175
           C 356 268 290 292 256 292
           C 222 292 156 268 115 175
           Z"
        fill="url(#moonGrad8)"
        filter="drop-shadow(0 0 16px rgba(56, 189, 248, 0.95))" />

  <!-- Outer Trishul Horns / Prongs with Sharp Barbed Tips -->
  <!-- Left Prong -->
  <path d="M 105 45
           C 107 40 114 42 116 48
           L 126 86
           L 138 90
           C 134 112 144 195 168 245
           C 192 290 224 306 244 312
           L 244 336
           C 202 334 158 312 128 266
           C 98 220 88 152 86 98
           L 96 94
           Z"
        fill="url(#bladeGrad8)"
        filter="drop-shadow(0 4px 14px rgba(2, 132, 199, 0.5))" />

  <!-- Left Prong Edge Highlight -->
  <path d="M 106 48 L 126 88 C 136 140 152 210 188 270" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Right Prong (Mirrored) -->
  <path d="M 407 45
           C 405 40 398 42 396 48
           L 386 86
           L 374 90
           C 378 112 368 195 344 245
           C 320 290 288 306 268 312
           L 268 336
           C 310 334 354 312 384 266
           C 414 220 424 152 426 98
           L 416 94
           Z"
        fill="url(#bladeGrad8)"
        filter="drop-shadow(0 4px 14px rgba(2, 132, 199, 0.5))" />

  <!-- Right Prong Edge Highlight -->
  <path d="M 406 48 L 386 88 C 376 140 360 210 324 270" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Center Spearhead Blade with Classic Diamond Barbed Head -->
  <path d="M 256 16
           L 282 85
           L 274 95
           C 288 155 292 215 288 265
           C 284 302 276 330 268 342
           L 244 342
           C 236 330 228 302 224 265
           C 220 215 224 155 238 95
           L 230 85
           Z"
        fill="url(#bladeGrad8)"
        filter="drop-shadow(0 4px 18px rgba(6, 182, 212, 0.65))" />

  <!-- Center Blade Spine Highlight -->
  <path d="M 256 22 L 256 340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95" />

  <!-- Sacred Tripundra (Three Horizontal Vibhuti Bands across center blade) -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))">
    <path d="M 230 196 Q 256 206 282 196" />
    <path d="M 226 211 Q 256 222 286 211" />
    <path d="M 230 226 Q 256 237 282 226" />
  </g>

  <!-- The Third Eye (Trinetra) Glowing Divine Flame -->
  <g filter="drop-shadow(0 0 16px rgba(245, 158, 11, 1))">
    <!-- Sacred Almond Flame -->
    <path d="M 256 188 C 267 200 267 220 256 232 C 245 220 245 200 256 188 Z"
          fill="url(#eyeGrad8)" />
    <!-- Center Pure White Bindu / Agni Spark -->
    <circle cx="256" cy="210" r="3.5" fill="#ffffff" />
  </g>

  <!-- Base Collar / Floral Mount -->
  <rect x="214" y="340" width="84" height="16" rx="8" fill="#38bdf8" />
  <rect x="222" y="345" width="68" height="5" rx="2.5" fill="#ffffff" opacity="0.95" />

  <!-- Sacred Damru (Hourglass Cosmic Drum) -->
  <!-- Top Chamber -->
  <path d="M 218 366 L 294 366 L 270 392 L 242 392 Z" fill="#0284c7" />
  <ellipse cx="256" cy="366" rx="38" ry="6.5" fill="#38bdf8" />
  <!-- Bottom Chamber -->
  <path d="M 242 398 L 270 398 L 294 424 L 218 424 Z" fill="#0284c7" />
  <ellipse cx="256" cy="424" rx="38" ry="6.5" fill="#38bdf8" />
  <!-- Damru Criss-Cross Binding Cords -->
  <path d="M 224 367 L 268 392 L 224 423" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.85" />
  <path d="M 288 367 L 244 392 L 288 423" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.85" />
  <!-- Center Waist Knot / Ring -->
  <rect x="238" y="388" width="36" height="14" rx="7" fill="url(#goldGrad8)" />
  <!-- Damru Striker Beads & Tassels -->
  <path d="M 238 395 Q 204 405 198 416" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="197" cy="417" r="5.5" fill="#f59e0b" filter="drop-shadow(0 0 7px rgba(245, 158, 11, 1))" />
  <path d="M 274 395 Q 308 405 314 416" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="315" cy="417" r="5.5" fill="#f59e0b" filter="drop-shadow(0 0 7px rgba(245, 158, 11, 1))" />

  <!-- Compact Ornamental Lotus Jewel Base -->
  <path d="M 252 428 L 260 428 L 259 462 L 253 462 Z" fill="url(#bladeGrad8)" />
  <rect x="244" y="462" width="24" height="6" rx="3" fill="#38bdf8" />
  <path d="M 256 480 L 244 466 L 268 466 Z" fill="#22d3ee" />
</svg>